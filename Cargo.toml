[workspace]
resolver = "3"
members = [
    "crates/kernel",
    "crates/plugin-api",
    "crates/domain-runtime",
    "crates/core",
    "crates/crypto",
    "crates/storage",
    "crates/platform",
    "crates/clipboard",
    "crates/capture",
    "crates/media",
    "crates/sync",
    "hub",
    "desktop/src-tauri",
    "crates/crypto-wasm",
]
default-members = [
    "crates/kernel",
    "crates/plugin-api",
    "crates/domain-runtime",
    "crates/core",
    "crates/crypto",
    "crates/storage",
    "crates/platform",
    "crates/clipboard",
    "crates/capture",
    "crates/media",
    "crates/sync",
    "hub",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
authors = ["Asterism Contributors"]
repository = "https://github.com/shiein/asterism"
description = "Cross-device clipboard, screenshot, and self-hosted hub"

[workspace.dependencies]
asterism-kernel = { path = "crates/kernel" }
asterism-plugin-api = { path = "crates/plugin-api" }
asterism-domain-runtime = { path = "crates/domain-runtime" }
asterism-core = { path = "crates/core" }
asterism-crypto = { path = "crates/crypto" }
asterism-storage = { path = "crates/storage" }
asterism-platform = { path = "crates/platform" }
asterism-clipboard = { path = "crates/clipboard" }
asterism-capture = { path = "crates/capture" }
asterism-media = { path = "crates/media" }
asterism-sync = { path = "crates/sync" }

argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
base64 = "0.22"
bitflags = { version = "2.9", features = ["serde"] }
blake3 = "1.8"
bytes = { version = "1.10", features = ["serde"] }
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
parking_lot = "0.12"
prost = "0.14"
rand = "0.8"
rcgen = "0.13"
rusqlite = { version = "0.32", features = ["bundled", "blob", "backup"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.20"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors", "limit", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.17", features = ["v7", "serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[package]
name = "asterism-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Asterism desktop shell"

[lib]
name = "asterism_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
hex.workspace = true
image.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
parking_lot.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
mdns-sd = "0.13"
asterism-capture.workspace = true
asterism-clipboard.workspace = true
asterism-core.workspace = true
asterism-domain-runtime.workspace = true
asterism-kernel.workspace = true
asterism-plugin-api = { workspace = true, features = ["host-issuer"] }
asterism-crypto.workspace = true
asterism-platform.workspace = true
asterism-storage.workspace = true
asterism-sync.workspace = true
asterism-media.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

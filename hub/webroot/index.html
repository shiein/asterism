<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Asterism History</title>
  <style>
    :root { color-scheme: dark; font-family: Palatino, "Songti SC", serif; background:#11140f; color:#edf0e8; }
    body { margin:0; }
    main { max-width:760px; margin:6vh auto; padding:0 24px 64px; }
    .muted { color:#9aa394; }
    .err { color:#e07a6a; }
    label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:#9aa394; margin:8px 0; }
    input, button { border:1px solid #2c3328; background:#1b2018; color:#edf0e8; padding:8px 10px; border-radius:8px; }
    button { cursor:pointer; }
    li { display:flex; gap:12px; justify-content:space-between; background:#1b2018; border:1px solid #2c3328; border-radius:10px; padding:10px 12px; margin:8px 0; list-style:none; }
    ul { padding:0; }
  </style>
</head>
<body>
<main>
  <h1>Asterism 历史中心</h1>
  <p class="muted">内嵌于 asterism-hub。Hub 只存密文；解锁后在浏览器解密预览。</p>
  <label>配对码<input id="code" placeholder="桌面生成的一次性码"/></label>
  <label>Recovery Key<input id="rec"/></label>
  <button id="pair">配对并加载</button>
  <button id="out">退出</button>
  <p id="status" class="muted"></p>
  <p id="err" class="err"></p>
  <input id="q" placeholder="搜索已解密预览" style="width:100%"/>
  <ul id="list"></ul>
</main>
<script>
const deviceId = localStorage.getItem("asterism.web.device_id") || crypto.randomUUID();
localStorage.setItem("asterism.web.device_id", deviceId);
const $ = (id) => document.getElementById(id);
$("rec").value = sessionStorage.getItem("asterism.vault.unlocked") || "";
$("pair").onclick = async () => {
  $("err").textContent = "";
  try {
    const res = await fetch("/api/v1/pairing/finish", {
      method: "POST", headers: {"content-type":"application/json"},
      body: JSON.stringify({
        code: $("code").value.trim(),
        device_id: deviceId,
        device_name: "Browser",
        platform: "browser",
        identity_public_key: [0]
      })
    });
    if (!res.ok) throw new Error("pairing " + res.status);
    const session = await res.json();
    localStorage.setItem("asterism.token", session.token);
    sessionStorage.setItem("asterism.vault.unlocked", $("rec").value.trim().toLowerCase());
    await load();
  } catch (e) { $("err").textContent = String(e); }
};
$("out").onclick = () => { localStorage.removeItem("asterism.token"); sessionStorage.clear(); $("list").innerHTML=""; };
async function load() {
  const token = localStorage.getItem("asterism.token");
  if (!token) return;
  const res = await fetch("/api/v1/history?limit=200", { headers: { authorization: "Bearer " + token }});
  if (!res.ok) throw new Error("history " + res.status);
  const items = await res.json();
  window.__items = items;
  render();
  $("status").textContent = "已加载 " + items.length + " 条密文历史";
}
function render() {
  const q = $("q").value.toLowerCase();
  const items = (window.__items || []).filter((it) => !q || it.kind.toLowerCase().includes(q) || it.id.includes(q));
  $("list").innerHTML = items.map((it) => `<li><strong>${it.kind}</strong><span>${new Date(it.created_at_ms).toLocaleString()}</span><span>${it.logical_size} B</span></li>`).join("");
}
$("q").oninput = render;
if (localStorage.getItem("asterism.token")) load().catch((e) => $("err").textContent = String(e));
</script>
</body>
</html>

[package]
name = "asterism-clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native clipboard watch, normalize, dedup, and sensitive policy"

[dependencies]
asterism-core.workspace = true
asterism-crypto.workspace = true
asterism-platform.workspace = true
bytes.workspace = true
image.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.20"

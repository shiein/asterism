syntax = "proto3";

package asterism.sync.v1;

// 内部 Envelope。所有外部协议必须版本化。
message Envelope {
  uint32 protocol_version = 1;
  string message_id = 2;
  string request_id = 3;
  string device_id = 4;
  int64 timestamp_ms = 5;
  oneof body {
    Hello hello = 10;
    DeviceState device_state = 11;
    ItemOffer item_offer = 12;
    ItemReady item_ready = 13;
    ItemAck item_ack = 14;
    ItemDelete item_delete = 15;
    LanCandidates lan_candidates = 16;
    SyncCursor sync_cursor = 17;
    Ping ping = 18;
    Pong pong = 19;
  }
}

message Hello {
  uint32 protocol_version = 1;
  bytes identity_public_key = 2;
  repeated string capabilities = 3;
}

message DeviceState {
  string device_id = 1;
  int64 last_seen_at_ms = 2;
  bool revoked = 3;
}

message ItemOffer {
  string item_id = 1;
  string kind = 2;
  uint64 logical_size = 3;
  uint64 payload_size = 4;
  bytes dedup_tag = 5;
  uint32 flags = 6;
}

message ItemReady {
  string item_id = 1;
  string blob_id = 2;
}

message ItemAck {
  string item_id = 1;
  bool accepted = 2;
  string reason = 3;
}

message ItemDelete {
  string item_id = 1;
}

message LanCandidates {
  repeated string endpoints = 1;
}

message SyncCursor {
  string scope = 1;
  string cursor = 2;
}

message Ping {
  uint64 nonce = 1;
}

message Pong {
  uint64 nonce = 1;
}

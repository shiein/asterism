[package]
name = "asterism-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Versioned sync protocol and transport (LAN TLS / Hub WSS)"

[dependencies]
asterism-core.workspace = true
asterism-crypto.workspace = true
asterism-platform.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util = "0.3"
hex.workspace = true
mdns-sd = "0.13"
parking_lot.workspace = true
rand.workspace = true
rcgen.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing.workspace = true
url = "2.5"

[dev-dependencies]
tempfile = "3.20"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
